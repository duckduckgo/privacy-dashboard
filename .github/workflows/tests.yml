name: Test & Deploy Docs
on:
    pull_request:
    push:
        branches:
            - main
permissions:
    contents: read
    pages: write
    id-token: write
    deployments: write
jobs:
    build:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'
            - name: Cache node modules
              id: cache-npm
              uses: actions/cache@v3
              env:
                  cache-name: cache-node-modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
            - name: Cache build outputs
              id: build-output
              uses: actions/cache@v3
              with:
                  path: build/docs
                  key: build-output-${{ github.run_id }}
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Build all
              run: npm run build && npm run build.debug
            - name: Fetch fonts
              run: npm run fetch-fonts
            - name: Run tests
              run: npm run test.unit
            ###
            ###  Run clean-tree following the build - no changes should be present
            ###
            - name: Clean tree (build)
              run: npm run test.clean-tree
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests (none-screenshots)
              run: npm run test.int -- --grep-invert @screenshots
            - name: Run Playwright tests (screenshots only)
              run: npm run test.int -- --grep @screenshots
              id: screenshot_tests
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - if: ${{ failure() && steps.screenshot_tests.conclusion == 'failure' }}
              run: npm run test.int -- --grep @screenshots --update-snapshots --last-failed
            - if: ${{ failure() && steps.screenshot_tests.conclusion == 'failure' }}
              name: Upload screens
              uses: actions/upload-artifact@v4
              with:
                  name: integration-tests
                  path: integration-tests/
                  retention-days: 10
            - name: Build docs
              run: npm run docs
            - name: copy-to-docs
              run: cp -r build/app-debug/ build/docs/app-debug
    deploy:
        runs-on: macos-latest
        needs: build
        if: ${{ github.ref == 'refs/heads/main' }}
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
            - name: Cache build outputs
              id: build-output
              uses: actions/cache@v4
              with:
                  path: build/docs
                  key: build-output-${{ github.run_id }}
            - name: Setup Github Pages
              uses: actions/configure-pages@v5
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: build/docs
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    # TEMP: verifies the npm cooldown config. Remove before merging.
    npm-cooldown-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'
            - name: npm ci passes with the cooldown config
              run: |
                  npm --version
                  npm config get min-release-age allow-git strict-allow-scripts
                  npm ci
            - name: Cooldown blocks a package newer than 7 days (expect ETARGET)
              if: success() || failure()
              run: |
                  VERSION=$(npm view caniuse-lite time --json | node -e '
                      const t = JSON.parse(require("fs").readFileSync(0, "utf8"));
                      const day = 864e5;
                      const recent = Object.entries(t)
                          .filter(([k, d]) => !["created", "modified"].includes(k) && Date.now() - Date.parse(d) < 7 * day)
                          .sort((a, b) => Date.parse(a[1]) - Date.parse(b[1]));
                      if (!recent.length) { console.error("no caniuse-lite version under 7 days old"); process.exit(1); }
                      console.log(recent[0][0]);
                  ')
                  echo "Trying caniuse-lite@$VERSION"
                  if out=$(npm pack --dry-run "caniuse-lite@$VERSION" 2>&1); then echo "$out"; echo "FAIL: cooldown not enforced"; exit 1; fi
                  echo "$out"
                  echo "$out" | grep -q ETARGET
            - name: allow-git=root blocks transitive git deps (expect EALLOWGIT)
              if: success() || failure()
              run: |
                  if out=$(npm pack --dry-run github:npm/ini 2>&1); then echo "$out"; echo "FAIL: git dep allowed"; exit 1; fi
                  echo "$out"
                  echo "$out" | grep -q EALLOWGIT
            - name: npm older than 11.10 fails loudly (expect EBADENGINE)
              if: success() || failure()
              run: |
                  rm -rf node_modules
                  if out=$(npx -y npm@11.5.2 ci --dry-run --ignore-scripts 2>&1); then echo "$out"; echo "FAIL: old npm installed silently"; exit 1; fi
                  echo "$out"
                  echo "$out" | grep -q EBADENGINE
